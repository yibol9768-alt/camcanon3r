[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camcanon3r"
version = "0.1.0"
description = "Auditing and repairing preprocessing-induced geometry drift in feed-forward 3D reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
  "scipy>=1.10,<1.16",
]

[project.scripts]
camcanon3r = "camcanon3r.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
